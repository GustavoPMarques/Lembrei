name: CI/CD Lembrei

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build-test:
    name: Build e testes do backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend-api/lembrei-api
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Instalar Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend-api/lembrei-api/pom.xml
      - name: Compilar, testar e empacotar
        run: sh ./mvnw -B -ntp clean verify
      - name: Publicar relatorios de testes
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: testes-backend
          path: backend-api/lembrei-api/target/surefire-reports/*.xml
          if-no-files-found: warn
          retention-days: 7
      - name: Publicar JAR
        uses: actions/upload-artifact@v7
        with:
          name: lembrei-api-jar
          path: backend-api/lembrei-api/target/lembrei-api-0.0.1-SNAPSHOT.jar
          if-no-files-found: error
          retention-days: 7

  mobile-test:
    name: Verificacoes do mobile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile-app
    env:
      CI: '1'
      EXPO_PUBLIC_API_URL: https://lembrei-api.onrender.com/api/v1
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Instalar Node
        uses: actions/setup-node@v6
        with:
          node-version: '26.6.0'
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Verificar TypeScript
        run: npm run typecheck
      - name: Verificar lint
        run: npm run lint
      - name: Executar testes unitarios
        run: npm test
      - name: Exportar Android e web
        run: npx expo export --platform android --platform web --output-dir dist

  oracle-db:
    name: Oracle descartavel e integracao
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Instalar Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend-api/lembrei-api/pom.xml
      - name: Preparar credenciais temporarias
        shell: bash
        run: |
          oracle_ci_password="$(openssl rand -hex 16)"
          echo "::add-mask::$oracle_ci_password"
          echo "ORACLE_CI_PASSWORD=$oracle_ci_password" >> "$GITHUB_ENV"
      - name: Subir Oracle e executar scripts
        run: bash database/ci/run_ci.sh
      - name: Executar testes Java com Oracle
        working-directory: backend-api/lembrei-api
        env:
          ORACLE_URL: jdbc:oracle:thin:@//localhost:1521/FREEPDB1
          ORACLE_USER: lembrei_ci
          ORACLE_PASSWORD: ${{ env.ORACLE_CI_PASSWORD }}
          LEMBREI_ORACLE_TESTS: 'true'
        run: sh ./mvnw -B -ntp -Dtest=OracleIntegrationTest test
      - name: Publicar logs dos scripts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: testes-oracle
          path: |
            ci-logs/*.log
            backend-api/lembrei-api/target/surefire-reports/*.xml
          if-no-files-found: warn
          retention-days: 7
      - name: Encerrar banco descartavel
        if: always()
        run: docker rm -f lembrei-oracle-ci || true

  docker-build:
    name: Validar imagem Docker
    runs-on: ubuntu-latest
    needs: [build-test, mobile-test, oracle-db]
    timeout-minutes: 20
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Construir imagem
        run: docker build --tag lembrei-api:ci backend-api/lembrei-api

  deploy:
    name: Disparar deploy no Render
    runs-on: ubuntu-latest
    needs: [build-test, mobile-test, oracle-db, docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    timeout-minutes: 5
    environment:
      name: production
      url: https://lembrei-api.onrender.com
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Solicitar deploy do commit aprovado
        shell: bash
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo '::error::Configure o secret RENDER_DEPLOY_HOOK_URL no GitHub.'
            exit 1
          fi
          code=$(curl -sS --connect-timeout 10 --max-time 60 \
            -o /dev/null -w '%{http_code}' -X POST \
            "${RENDER_DEPLOY_HOOK_URL}&ref=${GITHUB_SHA}")
          echo "Resposta do Render: HTTP $code"
          if [ "$code" != 200 ] && [ "$code" != 202 ]; then
            echo '::error::O Render nao aceitou a solicitacao de deploy.'
            exit 1
          fi
          {
            echo '## Render'
            echo
            echo "Deploy solicitado para o commit: $GITHUB_SHA"
            echo 'Acompanhe a conclusao do build e o estado Live no painel do Render.'
          } >> "$GITHUB_STEP_SUMMARY"
